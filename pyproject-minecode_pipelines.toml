[build-system]
requires = [ "flot>=0.7.3" ]
build-backend = "flot.buildapi"

[project]
name = "minecode_pipelines"
version = "1.0.1"
description = "A library for mining packageURLs and package metadata from ecosystem repositories."
readme = "README-minecode_pipelines.rst"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

authors = [
    { name = "AboutCode, nexB Inc. and others", email = "info@aboutcode.org" },
]

keywords = [
    "purl",
    "Package-URL",
    "open source",
    "package",
    "sca",
    "scan",
    "index",
    "federated",
    "data",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "aboutcode.hashid >= 0.2.0",
    "aboutcode.federated >= 1.0.3",
    "packageurl_python >= 0.17.6",
    "scancodeio >= 37.1.0",
    "ftputil >= 5.1.0",
    "jawa >= 2.2.0",
    "arrow >= 1.3.0",
    "beautifulsoup4 >= 4.13.4",
    "brotli>=1.2.0"
]

urls = { Homepage = "https://github.com/aboutcode-org/purldb" }

[project.entry-points."scancodeio_pipelines"]
mine_pypi = "minecode.pipelines.mine_pypi:MinePypi"
mine_npm = "minecode.pipelines.mine_npm:MineNPM"
mine_maven = "minecode.pipelines.mine_maven:MineMaven"
mine_cargo = "minecode.pipelines.mine_cargo:MineCargo"
mine_debian = "minecode.pipelines.mine_debian:MineDebian"
mine_nuget = "minecode.pipelines.mine_nuget:MineNuGet"
mine_alpine = "minecode.pipelines.mine_alpine:MineAlpine"
mine_conan = "minecode.pipelines.mine_conan:MineConan"
mine_cpan = "minecode.pipelines.mine_cpan:MineCpan"
mine_cran = "minecode.pipelines.mine_cran:MineCran"
mine_swift = "minecode.pipelines.mine_swift:MineSwift"
mine_composer = "minecode.pipelines.mine_composer:MineComposer"
mine_nix = "minecode.pipelines.mine_nix:MineNix"
mine_crates = "minecode.pipelines.mine_crates:MineCrates"
mine_apache = "minecode.pipelines.mine_apache:MineApache"

[tool.bumpversion]
current_version = "1.0.1"
allow_dirty = true

files = [
    { filename = "pyproject-minecode_pipelines.toml" },
]

[tool.flot]
includes = [
    "minecode/pipelines/*",
    "minecode/pipes/*",
    "minecode/utils.py",
]

excludes = [
    # Python compiled files
    "**/*.py[cod]",
    "**/*.egg-info",
    # Various junk and temp files
    "**/.DS_Store",
    "**/*~",
    "**/.*.sw[po]",
    "**/.ve",
    "**/*.bak",
    "**/.ipynb_checkpoints/*",
    "minecode/tests/**/*",
    "minecode/notebooks/*",
]

metadata_files = ["apache-2.0.LICENSE", "NOTICE"]
editable_paths = ["minecode_pipelines"]

