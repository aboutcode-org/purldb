[metadata]
name = purldb
version = 7.1.0
license_files =
    LICENSE
    AUTHORS.rst
    CHANGELOG.rst
author = nexB. Inc. and others
author_email = info@aboutcode.org
license = Apache-2.0 AND CC-BY-SA-4.0

# description must be on ONE line https://github.com/pypa/setuptools/issues/1390
description = A Django-based utility to collect Package data and Resources for collection and matching.
long_description = file:README.rst
long_description_content_type = text/x-rst
url = https://github.com/aboutcode-org/purldb

classifiers =
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Utilities

keywords =
    matchcode
    packagedb
    scancode
    purl
    purldb
    clearcode


[options]
packages = find:
include_package_data = true
zip_safe = false
python_requires = >=3.10
install_requires =
    scancodeio @ git+https://github.com/aboutcode-org/scancode.io@354fb98b305e0a809116e00850f33f8f948927c8
    PyGithub >= 2.6.1
    aboutcode.federated >= 0.1.0
    aboutcode.federatedcode >= 0.1.0
    arrow >= 1.3.0
    debian-inspector >= 31.1.1
    drf-spectacular >= 0.28.0
    fetchcode >= 0.6.0
    ftputil >= 5.1.0
    jawa >= 2.2.0
    markdown >= 3.8.2
    matchcode-toolkit >= 7.2.2
    minecode-pipelines
    natsort >= 8.4.0
    purl2vcs >= 2.0.0
    reppy2 >= 0.3.6
    rq-scheduler >= 0.14.0
    rubymarshal == 1.0.3
    samecode >= 0.5.1
    urlpy >= 0.5
setup_requires = setuptools_scm[toml] >= 4


[options.packages.find]
where = .

[options.extras_require]
dev =
    pytest >= 7.0.1
    pytest-xdist >= 2
    pytest-django
    aboutcode-toolkit >= 11.1.1
    mock
    flot
    ruff
    django-debug-toolbar
    twine
    Sphinx>=5.0.2
    sphinx-rtd-theme>=1.0.0
    sphinx-reredirects >= 0.1.2
    doc8>=0.11.2
    sphinx-autobuild
    sphinx-rtd-dark-mode>=1.3.0
    sphinx-copybutton
    sphinx_rtd_dark_mode

[options.entry_points]
console_scripts =
    purldb = purldb:command_line

scancodeio_pipelines =
    matching = matchcode.pipelines.matching:Matching
    d2d = scanpipe.pipelines.deploy_to_develop:DeployToDevelop
